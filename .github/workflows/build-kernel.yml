name: build-kernel

on:
  push:
    branches: [ '7.1', '6.16' ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ '7.1', '6.16' ]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        type: choice
        default: '7.1'
        options: [ '7.1', '6.16' ]

concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: begonia
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BRANCH: ${{ inputs.branch || github.ref_name }}

    steps:
      - name: Resolve branch
        run: |
          set -euo pipefail
          case "$BRANCH" in
            7.1|6.16) ;;
            *) echo "::error::unsupported branch '$BRANCH'"; exit 1 ;;
          esac
          echo "building branch $BRANCH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libelf-dev \
            device-tree-compiler cpio python3 rsync kmod \
            gcc-aarch64-linux-gnu ccache

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache -z
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --show-config | grep -E 'cache_dir|max_size|compression'

      - name: Restore ccache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.BRANCH }}-

      - name: Build
        run: ./build-begonia.sh -j "$(nproc)" --out out "$BRANCH"

      - name: Report ccache hit rate
        if: always()
        run: ccache -s

      - name: Verify artifacts
        run: |
          set -euo pipefail
          test -s "out/$BRANCH/Image"
          ls -l "out/$BRANCH"
          n=$(ls "out/$BRANCH"/mt6785-xiaomi-begonia-*.dtb | wc -l)
          test "$n" -ge 1 || { echo "no begonia DTBs"; exit 1; }
          echo "kernel: $(make -s -C . ARCH=arm64 O=out/$BRANCH/kernel kernelversion)"
          echo "binder: $(grep -E '^CONFIG_ANDROID_BINDER' out/$BRANCH/kernel/.config | tr '\n' ' ')"
          echo "mediatek: $(grep -E '^CONFIG_ARCH_MEDIATEK' out/$BRANCH/kernel/.config)"

      - name: Package
        run: |
          cd "out/$BRANCH"
          tar czf "../../mt6785-begonia-$BRANCH.tar.gz" Image mt6785-xiaomi-begonia-*.dtb

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.BRANCH }}-${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt6785-begonia-${{ env.BRANCH }}
          path: |
            out/$BRANCH/Image
            out/$BRANCH/mt6785-xiaomi-begonia-*.dtb
            mt6785-begonia-${{ env.BRANCH }.tar.gz
          if-no-files-found: error